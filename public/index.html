<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IG 留言抽獎工具</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;
  background:#f6f7fb;
  color:#222;
}

.container{
  max-width:720px;
  margin:auto;
  padding:25px 16px 50px;
}

.card{
  background:#fff;
  border-radius:20px;
  padding:22px;
  margin-bottom:16px;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
}

h1{
  margin:0 0 8px;
  font-size:28px;
}

h2{
  font-size:19px;
  margin:0 0 15px;
}

.desc{
  color:#777;
  margin-bottom:20px;
}

label{
  display:block;
  font-weight:bold;
  margin:15px 0 7px;
}

input[type="text"],
input[type="number"],
textarea{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
  outline:none;
}

textarea{
  min-height:170px;
  resize:vertical;
}

input:focus,
textarea:focus{
  border-color:#777;
}

.upload{
  border:2px dashed #ddd;
  border-radius:15px;
  padding:20px;
  text-align:center;
  background:#fafafa;
}

.upload input{
  margin-top:12px;
  max-width:100%;
}

.row{
  display:flex;
  gap:12px;
}

.row>div{
  flex:1;
}

.check{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:15px;
}

.check input{
  width:18px;
  height:18px;
}

button{
  width:100%;
  border:0;
  border-radius:13px;
  padding:14px;
  margin-top:15px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.draw{
  background:#222;
  color:white;
}

.secondary{
  background:#eee;
  color:#222;
}

.status{
  margin-top:12px;
  padding:10px;
  background:#f1f2f5;
  border-radius:10px;
  color:#666;
  display:none;
}

.result{
  display:none;
  text-align:center;
}

.winner{
  padding:20px 5px;
  border-bottom:1px solid #eee;
}

.number{
  font-size:14px;
  color:#888;
}

.username{
  font-size:29px;
  font-weight:bold;
  margin:7px 0;
}

.comment{
  color:#666;
  word-break:break-word;
}

.badge{
  display:inline-block;
  padding:6px 12px;
  border-radius:20px;
  background:#eee;
  font-size:13px;
  font-weight:bold;
}

.small{
  color:#777;
  font-size:13px;
  line-height:1.6;
}

@media(max-width:500px){
  .row{
    flex-direction:column;
    gap:0;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="card">
    <span class="badge">🎁 IG 留言抽獎</span>

    <h1>IG 留言抽獎工具</h1>

    <div class="desc">
      匯入 Instagram 留言後，快速隨機抽出中獎者。
    </div>

    <label>Instagram 貼文網址（選填）</label>

    <input
      id="postUrl"
      type="text"
      placeholder="https://www.instagram.com/p/..."
    >
  </div>


  <div class="card">

    <h2>① 匯入留言</h2>

    <div class="upload">

      <strong>📁 上傳 CSV 或 TXT</strong>

      <div class="small">
        CSV 建議格式：username,comment
      </div>

      <input
        id="fileInput"
        type="file"
        accept=".csv,.txt"
      >

    </div>


    <label>或直接貼上留言</label>

    <textarea
      id="comments"
      placeholder="例如：

alice,我想參加！
bob,抽我抽我！
charlie,希望可以中獎！
david,參加抽獎"
    ></textarea>

    <div id="status" class="status"></div>

  </div>


  <div class="card">

    <h2>② 抽獎設定</h2>

    <div class="row">

      <div>

        <label>中獎人數</label>

        <input
          id="winnerCount"
          type="number"
          min="1"
          value="1"
        >

      </div>


      <div>

        <label>關鍵字（選填）</label>

        <input
          id="keyword"
          type="text"
          placeholder="例如：參加"
        >

      </div>

    </div>


    <label class="check">

      <input
        id="onePerUser"
        type="checkbox"
        checked
      >

      每個帳號最多中獎一次

    </label>


    <button
      class="draw"
      id="drawButton"
    >
      🎉 開始抽獎
    </button>


    <button
      class="secondary"
      id="clearButton"
    >
      清除重新開始
    </button>

  </div>


  <div
    class="card result"
    id="result"
  >

    <span class="badge">
      🎉 抽獎結果
    </span>

    <div id="winners"></div>

    <button
      class="draw"
      id="againButton"
    >
      再抽一次
    </button>

  </div>

</div>


<script>

let commentsData = [];


/* =========================
   CSV 解析
========================= */

function parseCSV(text){

  const rows = [];

  let row = [];
  let cell = "";
  let insideQuotes = false;

  for(let i = 0; i < text.length; i++){

    const char = text[i];
    const next = text[i + 1];

    if(char === '"'){

      if(insideQuotes && next === '"'){

        cell += '"';
        i++;

      }else{

        insideQuotes = !insideQuotes;

      }

    }else if(char === ',' && !insideQuotes){

      row.push(cell);
      cell = "";

    }else if(
      (char === '\n' || char === '\r')
      && !insideQuotes
    ){

      if(char === '\r' && next === '\n'){
        i++;
      }

      row.push(cell);
      cell = "";

      if(row.some(x => x.trim() !== "")){
        rows.push(row);
      }

      row = [];

    }else{

      cell += char;

    }

  }

  if(cell !== "" || row.length){

    row.push(cell);

    if(row.some(x => x.trim() !== "")){
      rows.push(row);
    }

  }

  return rows;

}


/* =========================
   將資料轉成留言
========================= */

function convertToComments(text){

  const rows = parseCSV(text.trim());

  if(!rows.length){
    return [];
  }

  const firstRow =
    rows[0].map(
      x => x.trim().toLowerCase()
    );

  const usernameNames = [
    "username",
    "user",
    "account",
    "帳號",
    "使用者名稱"
  ];

  const commentNames = [
    "comment",
    "comments",
    "text",
    "留言",
    "內容"
  ];

  let usernameIndex =
    firstRow.findIndex(
      x => usernameNames.includes(x)
    );

  let commentIndex =
    firstRow.findIndex(
      x => commentNames.includes(x)
    );


  const hasHeader =
    usernameIndex >= 0 ||
    commentIndex >= 0;


  if(hasHeader){

    if(usernameIndex < 0){
      usernameIndex = 0;
    }

    if(commentIndex < 0){
      commentIndex = 1;
    }

    return rows
      .slice(1)
      .map(row => ({

        username:
          (row[usernameIndex] || "").trim(),

        text:
          (row[commentIndex] || "").trim()

      }))
      .filter(
        x => x.username || x.text
      );

  }


  return rows
    .map(row => ({

      username:
        (row[0] || "").trim(),

      text:
        row.slice(1).join(",").trim()

    }))
    .filter(
      x => x.username || x.text
    );

}


/* =========================
   更新留言數量
========================= */

function updateStatus(){

  const status =
    document.getElementById("status");

  if(commentsData.length){

    status.style.display = "block";

    status.textContent =
      `目前已載入 ${commentsData.length} 則留言`;

  }else{

    status.style.display = "none";

  }

}


/* =========================
   讀取檔案
========================= */

document
  .getElementById("fileInput")
  .addEventListener("change", async function(){

    const file = this.files[0];

    if(!file){
      return;
    }

    const text =
      await file.text();

    document
      .getElementById("comments")
      .value = text;

    commentsData =
      convertToComments(text);

    updateStatus();

  });


/* =========================
   手動貼上留言
========================= */

document
  .getElementById("comments")
  .addEventListener("input", function(){

    commentsData =
      convertToComments(this.value);

    updateStatus();

  });


/* =========================
   隨機排序
========================= */

function shuffle(array){

  const result =
    array.slice();

  for(
    let i = result.length - 1;
    i > 0;
    i--
  ){

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );

    [
      result[i],
      result[j]
    ] = [
      result[j],
      result[i]
    ];

  }

  return result;

}


/* =========================
   HTML 安全處理
========================= */

function escapeHTML(text){

  return String(text).replace(
    /[&<>"']/g,
    function(char){

      const map = {

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"

      };

      return map[char];

    }
  );

}


/* =========================
   開始抽獎
========================= */

function drawLottery(){

  commentsData =
    convertToComments(
      document.getElementById("comments").value
    );


  if(!commentsData.length){

    alert("請先匯入留言。");

    return;

  }


  const keyword =
    document
      .getElementById("keyword")
      .value
      .trim()
      .toLowerCase();


  let pool =
    commentsData.filter(function(comment){

      if(!keyword){
        return true;
      }

      return comment.text
        .toLowerCase()
        .includes(keyword);

    });


  /* 每個帳號最多一次 */

  if(
    document
      .getElementById("onePerUser")
      .checked
  ){

    const used =
      new Set();

    pool =
      pool.filter(function(comment){

        const username =
          comment.username
            .trim()
            .toLowerCase();

        if(used.has(username)){
          return false;
        }

        used.add(username);

        return true;

      });

  }


  const count =
    Math.max(
      1,
      parseInt(
        document.getElementById("winnerCount").value || 1,
        10
      )
    );


  if(!pool.length){

    alert(
      "符合條件的留言為 0，請調整抽獎條件。"
    );

    return;

  }


  const winners =
    shuffle(pool)
      .slice(
        0,
        Math.min(count, pool.length)
      );


  const winnersBox =
    document.getElementById("winners");


  winnersBox.innerHTML =
    winners.map(function(winner, index){

      return `

        <div class="winner">

          <div class="number">
            第 ${index + 1} 位
          </div>

          <div class="username">
            @${escapeHTML(
              winner.username || "匿名"
            )}
          </div>

          <div class="comment">
            ${escapeHTML(
              winner.text || "（無留言內容）"
            )}
          </div>

        </div>

      `;

    }).join("");


  const result =
    document.getElementById("result");

  result.style.display = "block";

  result.scrollIntoView({
    behavior:"smooth",
    block:"center"
  });

}


/* =========================
   按鈕
========================= */

document
  .getElementById("drawButton")
  .addEventListener(
    "click",
    drawLottery
  );


document
  .getElementById("againButton")
  .addEventListener(
    "click",
    drawLottery
  );


document
  .getElementById("clearButton")
  .addEventListener(
    "click",
    function(){

      document.getElementById("postUrl").value = "";

      document.getElementById("comments").value = "";

      document.getElementById("keyword").value = "";

      document.getElementById("winnerCount").value = "1";

      document.getElementById("fileInput").value = "";

      document.getElementById("status").style.display = "none";

      document.getElementById("result").style.display = "none";

      commentsData = [];

    }
  );

</script>

</body>
</html>
